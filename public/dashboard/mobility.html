(function () {
  "use strict";
  var API = "/api/dashboard/mobility";
  var VER = 0, ME = { canEdit: false, canWrite: false, email: "" };
  function E(code, msg) { var e = new Error(msg || code); e.code = code; return e; }
  async function J(url, opt) {
    var r = await fetch(url, Object.assign({ cache: "no-store", credentials: "same-origin" }, opt || {}));
    var b = {}; try { b = await r.json(); } catch (e) {}
    if (!r.ok) throw E(b.code || (r.status === 409 ? "conflict" : r.status === 403 ? "not_writer" : r.status === 401 ? "not_signed_in" : "http_" + r.status), b.error);
    return b;
  }
  function post(body) { return J(API + "/db", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); }

  /* ---- db: đọc/ghi + theo dõi thay đổi (hỏi lại máy chủ mỗi 20 giây, và ngay sau mỗi lần ghi) ---- */
  var SUBS = [];
  function docSnap(path, r) { return { id: path.split("/").pop(), exists: !!r.exists, data: function () { return r.exists ? r.data : undefined; } }; }
  async function poll(s) {
    try {
      if (s.kind === "doc") {
        var r = await J(API + "/db?doc=" + encodeURIComponent(s.path));
        var sig = (r.exists ? 1 : 0) + "|" + r.ts;
        if (sig !== s.last) { s.last = sig; s.cb(docSnap(s.path, r)); }
      } else {
        var c = await J(API + "/db?col=" + encodeURIComponent(s.path));
        if (c.stamp !== s.last) {
          s.last = c.stamp;
          var docs = c.docs.map(function (d) { return { id: d.id, exists: true, data: function () { return d.data; } }; });
          s.cb({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
        }
      }
      s.ok = true;
    } catch (e) { if (!s.ok && s.eb) { s.ok = true; s.eb(e); } }
  }
  function sub(s) { SUBS.push(s); poll(s); return function () { var i = SUBS.indexOf(s); if (i >= 0) SUBS.splice(i, 1); }; }
  function pollAll() { SUBS.forEach(poll); }
  setInterval(function () { if (!document.hidden) pollAll(); }, 20000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pollAll(); });

  function doc(path) {
    return {
      id: path.split("/").pop(), path: path,
      get: async function () { return docSnap(path, await J(API + "/db?doc=" + encodeURIComponent(path))); },
      set: async function (data) { await post({ op: "set", path: path, data: data }); pollAll(); },
      update: async function (data) { await post({ op: "update", path: path, data: data }); pollAll(); },
      delete: async function () { await post({ op: "delete", path: path }); pollAll(); },
      onSnapshot: function (cb, eb) { return sub({ kind: "doc", path: path, cb: cb, eb: eb }); },
    };
  }
  function collection(path) {
    return {
      path: path,
      doc: function (id) { return doc(path + "/" + id); },
      get: async function () { var c = await J(API + "/db?col=" + encodeURIComponent(path)); var docs = c.docs.map(function (d) { return { id: d.id, exists: true, data: function () { return d.data; } }; }); return { docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } }; },
      onSnapshot: function (cb, eb) { return sub({ kind: "col", path: path, cb: cb, eb: eb }); },
    };
  }
  var db = { doc: doc, collection: collection };

  /* ---- artifact.publish: tách phần số liệu trong trang và lưu vào Supabase ---- */
  var TAG = '<script id="state" type="application/json">';
  var artifact = {
    publish: async function (html) {
      if (!ME.canEdit) throw E("not_writer");
      var a = html.indexOf(TAG); if (a < 0) throw E("bad_page", "Không tìm thấy số liệu trong trang");
      a += TAG.length; var b = html.indexOf("</" + "script>", a);
      var data = JSON.parse(html.slice(a, b));
      try {
        var r = await J(API + "/state", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ version: VER, data: data }) });
        VER = r.version;
        setTimeout(function () { location.reload(); }, 700);
      } catch (e) {
        if (e.code === "conflict") setTimeout(function () { location.reload(); }, 3000);
        throw e;
      }
    },
  };
  var user = {
    canEdit: async function () { return ME.canEdit; },
    can: async function (p) { return p === "data.write" ? ME.canWrite : ME.canEdit; },
    me: async function () { return { email: ME.email }; },
  };
  var downloads = {
    save: async function (o) {
      var blob = o.data instanceof Blob ? o.data : new Blob([o.data], { type: o.mimeType || "application/octet-stream" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = o.filename || "download";
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    },
  };
  var CAPS = { db: db, artifact: artifact, user: user, downloads: downloads };
  window.claude = { use: async function (n) { return CAPS[n] || null; } };

  /* ---- khởi động ---- */
  function msg(t) { var el = document.getElementById("app"); if (el) el.innerHTML = '<div class="page"><div class="card">' + t + "</div></div>"; }
  (async function () {
    try {
      var r = await J(API + "/state");
      ME = r.me || ME; VER = r.version || 0;
      if (!r.data) {
        msg("<b>Chưa có số liệu dashboard Mobility.</b><br>" + (ME.canEdit ? "Bấm nút <b>Nhập dữ liệu</b> ở thanh trên để nạp file dữ liệu (mobility_import.json)." : "Liên hệ Quản trị để nạp dữ liệu lần đầu."));
        return;
      }
      document.getElementById("state").textContent = JSON.stringify(r.data);
    } catch (e) {
      msg("Không tải được số liệu: " + (e.message || e.code)); return;
    }
    var s = document.createElement("script");
    s.textContent = document.getElementById("main").textContent;
    document.body.appendChild(s);
  })();
})();
</script></body></html>
