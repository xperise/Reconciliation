<title>Mobility · XPAY Dashboard</title><style id="xstyle">
.xd{--color-content-default:#222222;--color-content-subtle:#6b6c6d;--color-content-primary:#00a693;--color-content-accent:#b041ff;--color-content-negative:#e83c3f;--color-content-warning:#e8a600;--color-content-positive:#3bb37b;--color-content-info:#3b85ff;--color-surface-default:#ffffff;--color-surface-secondary:#f0f0f2;--color-surface-primary:#edfaf8;--color-surface-accent:#faf2ff;--color-surface-negative-subtle:#e83c3f1a;--color-surface-warning-subtle:#e8a6001a;--color-surface-positive-subtle:#3bb37b1a;--color-surface-info-subtle:#3b85ff1a;--color-canvas-secondary:#f7f7fa;--color-action-theme-primary:#00a693;--color-action-theme-primary-hover:#009382;--color-action-theme-primary-active:#006e61;--color-action-accent-primary:#b041ff;--color-action-black-secondary:#e3e3e5;--color-border-default:#00000033;--color-border-secondary:#0000001a;--color-border-tertiary:#0000000d;--color-icon-subtle:#9c9d9e;--color-display-cyan-default:#00a693;--color-display-cyan-medium:#5ed6c8;--color-display-purple-default:#b041ff;--color-display-gray-default:#9c9d9e;--color-display-gray-medium:#d9d9db;--color-display-orange-default:#ed8118;--elevation-sm:0 1px 3px #00000014,0 1px 2px #0000000d;--radius-rounded-10:10px;--radius-rounded-16:16px;--radius-rounded-20:20px;--radius-pill:9999px;--font-family-sans-serif:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--accent:var(--color-action-theme-primary);--ink:#222222;--ink-2:#6b6c6d;--ink-3:#9c9d9e;--critical:var(--color-content-negative);--high:var(--color-display-orange-default);--watch:var(--color-content-warning);--stable:var(--color-content-positive);--surface:var(--color-surface-default);--surface-2:var(--color-canvas-secondary);--line:var(--color-border-secondary);--line-soft:var(--color-border-tertiary)}
html,body{margin:0;background:#f7f7fa}
.xd{font-family:var(--font-family-sans-serif);color:var(--ink);font-size:13px;background:var(--surface-2);min-height:100vh}
.xd *{box-sizing:border-box}
.xd .num{font-variant-numeric:tabular-nums}
.xd .top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.xd .brand{font-weight:700;font-size:15px}.xd .brand b{color:var(--accent)}
.xd .tabs{display:flex;gap:4px}
.xd .tab{border:0;background:transparent;padding:7px 12px;border-radius:var(--radius-rounded-10);font:600 13px var(--font-family-sans-serif);color:var(--ink-2);cursor:pointer}
.xd .tab.on{background:var(--color-surface-primary);color:var(--color-action-theme-primary-active)}
.xd .ctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xd select,.xd input[type=number]{font:13px var(--font-family-sans-serif);padding:6px 28px 6px 10px;border:1px solid var(--color-border-default);border-radius:var(--radius-rounded-10);background-color:var(--surface);color:var(--ink)}
.xd input[type=number]{padding-right:10px;width:120px}
.xd .btn{font:600 13px var(--font-family-sans-serif);padding:7px 14px;border-radius:var(--radius-rounded-10);border:1px solid var(--color-border-default);background:var(--surface);cursor:pointer;color:var(--ink)}
.xd .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.xd .btn.pri:hover{background:var(--color-action-theme-primary-hover)}
.xd .btn:disabled{opacity:.5;cursor:default}
.xd .lbl{font-size:11px;color:var(--ink-2)}
.xd .page{max-width:1440px;margin:0 auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:16px}
.xd .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-rounded-16);box-shadow:var(--elevation-sm);padding:20px;min-width:0}
.xd .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.xd .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.xd .card-title{font-size:16px;font-weight:700;margin:0}
.xd .card-note{font-size:12px;color:var(--ink-2)}
.xd .banner{background:var(--color-surface-primary);border:1px solid #00a69333;border-radius:var(--radius-rounded-16);padding:14px 18px;line-height:1.6}
.xd .banner ul{margin:6px 0 0;padding-left:0;list-style:none}
.xd .banner li{padding-left:16px;position:relative}
.xd .banner li::before{content:"";position:absolute;left:2px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.xd .banner li.critical::before{background:var(--critical)}.xd .banner li.stable::before{background:var(--stable)}.xd .banner li.watch::before{background:var(--watch)}
.xd .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.xd .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-rounded-16);padding:14px 16px;box-shadow:var(--elevation-sm)}
.xd .kpi .k{font-size:12px;color:var(--ink-2)}
.xd .kpi .v{font-size:24px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.xd .kpi .s{font-size:12px;color:var(--ink-2)}
.xd .meter{height:5px;border-radius:9999px;background:var(--color-surface-secondary);margin-top:8px;overflow:hidden}
.xd .meter i{display:block;height:100%}
.xd .g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.xd .tw{overflow-x:auto}
.xd table{width:100%;border-collapse:collapse}
.xd th{font-size:11px;font-weight:600;color:var(--ink-2);text-align:right;padding:8px 9px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.xd td{padding:7px 9px;border-bottom:1px solid var(--line-soft);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.xd th.l,.xd td.l{text-align:left}
.xd td.name{font-weight:600;white-space:normal;min-width:200px}
.xd td .def{display:block;font-weight:400;font-size:11px;color:var(--ink-2)}
.xd tr.sec td{background:var(--color-surface-primary);color:var(--color-action-theme-primary-active);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left}
.xd td.adj{background:#fff7e0;font-weight:700}
.xd .pill{display:inline-block;padding:3px 9px;border-radius:9999px;font-size:11px;font-weight:600}
.xd .p-stable{background:var(--color-surface-positive-subtle);color:#22865a}
.xd .p-critical{background:var(--color-surface-negative-subtle);color:var(--critical)}
.xd .p-high{background:#ed81181a;color:#b35c08}
.xd .p-watch{background:var(--color-surface-warning-subtle);color:#9a6e00}
.xd .p-mute{background:var(--color-surface-secondary);color:var(--ink-2)}
.xd .up{color:#22865a}.xd .dn{color:var(--critical)}
.xd .c-stable{color:#22865a}.xd .c-watch{color:#9a6e00}.xd .c-high{color:#b35c08}.xd .c-critical{color:var(--critical)}
.xd details{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-rounded-16);box-shadow:var(--elevation-sm);padding:14px 20px}
.xd summary{cursor:pointer;font-weight:700;font-size:14px}
.xd .hint{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:10px}
.xd svg text{pointer-events:none;font-family:var(--font-family-sans-serif)}
.xd .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);align-items:center}
.xd .legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.xd .drop{border:1.5px dashed var(--color-border-default);border-radius:var(--radius-rounded-16);padding:18px;background:var(--surface-2)}
.xd .drop b{display:block;margin-bottom:6px}
.xd .log{font-size:12px;line-height:1.7;background:var(--surface-2);border-radius:var(--radius-rounded-10);padding:10px 12px;white-space:pre-wrap}
.xd .hidden{display:none}
.xd .tt{position:fixed;pointer-events:none;background:#222;color:#fff;font-size:12px;padding:7px 9px;border-radius:8px;opacity:0;z-index:20;line-height:1.5}
@media (max-width:900px){.xd .g2{grid-template-columns:minmax(0,1fr)}.xd .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.xd .ctl{margin-left:0}.xd .page{padding:12px 16px 32px}.xd .top{padding:10px 16px}}

.crbar{padding:12px 18px}
.crbar-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.crbar-search{display:flex;gap:10px;align-items:center;flex:1;min-width:280px}
.crbar-search input{font:13px var(--font-family-sans-serif);padding:8px 12px;border:1px solid var(--color-border-default);border-radius:10px;width:100%;max-width:380px}
.crbar-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crbar-flt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.crbar-flt select{padding:5px 8px;font-size:12.5px;max-width:190px}
.crbar-clr{cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px;margin-left:4px}
details.mn{position:relative;border:0!important;padding:0!important;margin:0!important;background:none!important;box-shadow:none!important;border-radius:0}
.crbar{overflow:visible}
details.mn>summary{list-style:none}
details.mn>summary::-webkit-details-marker{display:none}
.mnp{position:absolute;right:auto;left:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #00000022;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:200px}
.mnp.mnr{left:auto;right:0}
.mnp .btn{width:100%;text-align:left;border-color:transparent}
.mnp .btn:hover{background:var(--color-surface-primary)}

#crpane #bcs{display:none}

/* Bảng CEO: cố định dòng tiêu đề và cột Chỉ số khi cuộn ngang / dọc */
.ceo-tw{max-height:calc(100vh - 150px);overflow:auto;overscroll-behavior:contain}
.ceo thead th{position:sticky;top:0;z-index:3}
.ceo th:first-child,.ceo td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.ceo thead th:first-child{z-index:4;background:var(--surface-2)}
.ceo tr.sec td{position:static;background:var(--color-surface-primary);box-shadow:none}
.ceo .secl{position:sticky;left:12px}
.ceo td:first-child{min-width:230px;max-width:260px}

/* dòng Tổng cố định cuối bảng đơn vị */
.utot td{position:sticky;bottom:0;z-index:2;background:var(--surface-2);font-weight:700;border-top:2px solid var(--line)}

/* bộ chọn thời gian trên điện thoại dọc: bảng nổi dưới đáy màn hình, 1 tháng, mốc nhanh dạng nút ngang */
@media (max-width:640px){
  #rpp.rpp{position:fixed!important;left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto!important;max-width:none!important;max-height:86vh;overflow:auto;flex-direction:column;gap:10px!important;padding:12px!important;z-index:60!important}
  .rpp-pre{flex-direction:row!important;flex-wrap:wrap;min-width:0!important;border-right:0!important;border-bottom:1px solid var(--line-soft);padding:0 0 8px!important;gap:6px!important}
  .rpp-pre .tab{padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px}
  .rpp-m0{display:none}
  .rpp-ms{display:block!important}
  .rpp-grid{grid-template-columns:repeat(7,minmax(0,1fr))!important;font-size:14px!important}
  .rpp-grid [data-rpd]{padding:10px 0!important}
  #rpb{min-width:0!important;max-width:100%}
}

      var r = await J(API + "/state");
      ME = r.me || ME; VER = r.version || 0;
      if (!r.data) {
        msg("<b>Chưa có số liệu dashboard Mobility.</b><br>" + (ME.canEdit ? "Bấm nút <b>Nhập dữ liệu</b> ở thanh trên để nạp file dữ liệu (mobility_import.json)." : "Liên hệ Quản trị để nạp dữ liệu lần đầu."));
        return;
      }
      document.getElementById("state").textContent = JSON.stringify(r.data);
    } catch (e) {
      msg("Không tải được số liệu: " + (e.message || e.code)); return;
    }
    var s = document.createElement("script");
    s.textContent = document.getElementById("main").textContent;
    document.body.appendChild(s);
  })();
})();
</script></body></html>
